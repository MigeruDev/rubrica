# Publica el frontend de Rúbrica (frontend/dist) en GitHub Pages.
#
# La página publicada es estática. Por defecto se compila apuntando al Anvil
# local de quien la visita (http://127.0.0.1:8545, chainId 31337) y a la
# dirección determinista del primer despliegue en un Anvil limpio, así que cada
# visitante ve su propia cadena local. Para que la página hable con otra red,
# define estas variables de repositorio (Settings > Secrets and variables >
# Actions > Variables) y vuelve a lanzar el workflow:
#   - VITE_CONTRACT_ADDRESS  dirección del CertificateRegistry desplegado
#   - VITE_RPC_URL           endpoint JSON-RPC de la red
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_CONTRACT_ADDRESS: ${{ vars.VITE_CONTRACT_ADDRESS || '0x5FbDB2315678afecb367f032d93F642f64180aa3' }}
          VITE_RPC_URL: ${{ vars.VITE_RPC_URL || 'http://127.0.0.1:8545' }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
